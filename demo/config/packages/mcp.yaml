mcp:
    servers:
        demo:
            name: demo-app
            version: 0.0.1
            pagination_limit: 10
            instructions: |
                This demo MCP server provides time management capabilities for developers.

                Use this server when you need to work with timestamps, time zones, or time-based calculations.

            transports:
                stdio: true
                http: true
            http:
                path: /_mcp
            session:
                store: file

            registry: '*'

    clients:
        remotes:
            client_info:
                name: symfony-ai-demo
                version: 0.0.1
            servers:
                # Only speaks the legacy HTTP+SSE transport, so "mcp-remote" bridges it to
                # stdio. Needs Node.js.
                livescore:
                    transport: stdio
                    command: ['npx', '-y', 'mcp-remote', 'https://livescoremcp.com/sse']
                # Real-time NYC subway arrivals.
                transit:
                    transport: http
                    url: 'https://metro-mcp.anuragd.me/mcp'
                # Weather worldwide, with a rain radar drawn as text characters.
                weather:
                    transport: http
                    url: 'https://echorune.net/mcp'
        # The app's own MCP server, so a chat agent uses the same #[McpTool] services
        # external agents see. Spawns this app as a child process.
        self:
            client_info:
                name: symfony-ai-demo-self
                version: 0.0.1
            servers:
                demo:
                    transport: stdio
                    command: ['php', '%kernel.project_dir%/bin/console', 'mcp:server', 'demo']

